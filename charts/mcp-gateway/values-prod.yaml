# Production VPS / k3s Deployment Values
global:
  domain: "gateway.urumi-demo.ai"
  storageClass: "local-path" # Standard high-performance storage on k3s

mariadb:
  persistence:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

wordpress:
  persistence:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1536Mi

woocommerceMcp:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

gateway:
  # Stand-out item: Scaling (2 replicas behind Service load balancer)
  replicaCount: 2
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

dashboard:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: true
  className: "traefik" # default on k3s or "nginx"
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
  hosts:
    - host: "gateway.urumi-demo.ai"
      paths:
        - path: /store
          pathType: Prefix
          service: wordpress
          port: 80
        - path: /api
          pathType: Prefix
          service: gateway-backend
          port: 3000
        - path: /mcp
          pathType: Prefix
          service: gateway-backend
          port: 3000
        - path: /
          pathType: Prefix
          service: dashboard
          port: 80
  tls:
    - secretName: mcp-gateway-prod-tls
      hosts:
        - "gateway.urumi-demo.ai"

networkPolicies:
  enabled: true

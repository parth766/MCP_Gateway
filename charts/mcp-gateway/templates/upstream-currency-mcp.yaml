{{- if .Values.currencyMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-currency-mcp
  labels:
    app.kubernetes.io/name: currency-mcp
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.currencyMcp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: currency-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: currency-mcp
        {{- include "mcp-gateway.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: currency-mcp
          image: "{{ .Values.currencyMcp.image.repository }}:{{ .Values.currencyMcp.image.tag }}"
          imagePullPolicy: {{ .Values.currencyMcp.image.pullPolicy }}
          env:
            - name: PORT
              value: "4002"
            - name: REQUIRE_AUTH
              value: "true"
            - name: AUTH_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-secrets
                  key: currency-auth-token
          ports:
            - name: mcp-http
              containerPort: 4002
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.currencyMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: currency-mcp
  labels:
    app.kubernetes.io/name: currency-mcp
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4002
      targetPort: 4002
      name: mcp-http
  selector:
    app.kubernetes.io/name: currency-mcp
{{- end }}

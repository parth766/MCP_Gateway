{{- if .Values.analyticsMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-analytics-mcp
  labels:
    app.kubernetes.io/name: analytics-mcp
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.analyticsMcp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-mcp
        {{- include "mcp-gateway.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: analytics-mcp
          image: "{{ .Values.analyticsMcp.image.repository }}:{{ .Values.analyticsMcp.image.tag }}"
          imagePullPolicy: {{ .Values.analyticsMcp.image.pullPolicy }}
          env:
            - name: PORT
              value: "4003"
            - name: REQUIRE_AUTH
              value: "true"
            - name: AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-secrets
                  key: analytics-api-key
          ports:
            - name: mcp-http
              containerPort: 4003
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4003
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.analyticsMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-mcp
  labels:
    app.kubernetes.io/name: analytics-mcp
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4003
      targetPort: 4003
      name: mcp-http
  selector:
    app.kubernetes.io/name: analytics-mcp
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-secrets
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  mariadb-database: {{ .Values.mariadb.auth.database | quote }}
  mariadb-username: {{ .Values.mariadb.auth.username | quote }}
  mariadb-password: {{ .Values.mariadb.auth.password | quote }}
  mariadb-root-password: {{ .Values.mariadb.auth.rootPassword | quote }}
  wordpress-password: {{ .Values.wordpress.auth.adminPassword | quote }}
  wc-consumer-key: {{ .Values.wordpress.wcKeys.consumerKey | quote }}
  wc-consumer-secret: {{ .Values.wordpress.wcKeys.consumerSecret | quote }}
  gateway-encryption-key: {{ .Values.gateway.secrets.encryptionKey | quote }}
  currency-auth-token: {{ .Values.currencyMcp.authToken | quote }}
  analytics-api-key: {{ .Values.analyticsMcp.apiKey | quote }}
  llm-api-key: {{ .Values.gateway.secrets.llmApiKey | quote }}

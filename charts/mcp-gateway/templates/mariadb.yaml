{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-mariadb-pvc
  labels:
    app.kubernetes.io/name: mariadb
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.mariadb.persistence.accessMode }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mariadb.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-mariadb
  labels:
    app.kubernetes.io/name: mariadb
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate # Stateful database
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        {{- include "mcp-gateway.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-secrets
                  key: mariadb-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-secrets
                  key: mariadb-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-secrets
                  key: mariadb-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-secrets
                  key: mariadb-root-password
          ports:
            - name: mysql
              containerPort: 3306
          livenessProbe:
            exec:
              command: ["mariadb-admin", "ping", "-p{{ .Values.mariadb.auth.rootPassword }}"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mariadb-admin", "ping", "-p{{ .Values.mariadb.auth.rootPassword }}"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mcp-gateway.fullname" . }}-mariadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: mariadb
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app.kubernetes.io/name: mariadb
{{- end }}

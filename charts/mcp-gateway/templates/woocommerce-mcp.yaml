{{- if .Values.woocommerceMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-woocommerce-mcp
  labels:
    app.kubernetes.io/name: woocommerce-mcp
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.woocommerceMcp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: woocommerce-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woocommerce-mcp
        {{- include "mcp-gateway.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: woocommerce-mcp
          image: "{{ .Values.woocommerceMcp.image.repository }}:{{ .Values.woocommerceMcp.image.tag }}"
          imagePullPolicy: {{ .Values.woocommerceMcp.image.pullPolicy }}
          env:
            - name: PORT
              value: "4001"
            - name: WOOCOMMERCE_URL
              value: "http://wordpress:80"
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-secrets
                  key: wc-consumer-key
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-gateway.fullname" . }}-secrets
                  key: wc-consumer-secret
          ports:
            - name: mcp-http
              containerPort: 4001
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: woocommerce-mcp
  labels:
    app.kubernetes.io/name: woocommerce-mcp
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP # Internal only: NOT reachable from outside cluster
  ports:
    - port: 4001
      targetPort: 4001
      name: mcp-http
  selector:
    app.kubernetes.io/name: woocommerce-mcp
{{- end }}
